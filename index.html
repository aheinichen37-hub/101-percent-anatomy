<style>
/* Layout: one-column app, sticky stat line on top, answer bar pinned to the bottom during play. Version 2.8 */
:root{
  --bg:#111113; --panel:#1a1a1d; --panel2:#222226; --line:#2f2f34; --line2:#45454c;
  --fg:#ececee; --muted:#8e8e95; --dim:#5d5d64;
  --red:#ef4f55; --yellow:#f3c344; --green:#3fc372;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-block:14px 40px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;min-height:44px;padding-right:52px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--muted);font-weight:600}
.crumb{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.menuwrap{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:30}
.menubtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center}
.menubtn svg{transition:transform .2s}
.menubtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:52px;min-width:170px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:6px;display:grid;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.menu button{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;background:none;border-radius:8px;text-align:left;font-weight:500}
.menu button:hover:not(:disabled){background:var(--line)}
.menu button:disabled{color:var(--dim);cursor:default}

/* stat line */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat .v{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:2px}
.c-red{color:var(--red)}.c-yellow{color:var(--yellow)}.c-green{color:var(--green)}.c-none{color:var(--dim)}

.sect{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:grid;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--line2);transform:translateY(-1px)}
.tile .ico{width:42px;height:34px}
.tile h3{margin:0;font-family:var(--display);font-weight:600;font-size:23px;line-height:1.1;text-wrap:balance}
.tile .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.tile .meta span b{font-family:var(--mono);color:var(--fg);font-weight:600}
.play{justify-self:start;margin-top:2px;padding:8px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px}

/* play */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:10px 0 6px}
.qnum{font-family:var(--mono);font-size:14px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--fg);transition:width .3s}
.prompt{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
.figure{background:#0b0b0d;border:1px solid var(--line);border-radius:14px;padding:8px;overflow:hidden}
.figure svg{display:block;width:100%;height:auto;max-height:52vh}
.credit{margin-top:28px;font-size:12px;color:var(--dim)}
.hint{font-size:14px;color:var(--muted);margin:10px 2px 0}
.feedback{min-height:56px;margin:14px 0 0;display:grid;gap:10px}
.fb{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.fb.ok{color:var(--green)}.fb.bad{color:var(--red)}.fb.warn{color:var(--yellow)}
.fb small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:12px 20px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:600}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.spacer{height:170px}

/* answer bar, Krillion style */
.answer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);
  padding:22px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.answer form{display:flex;gap:4px;max-width:900px;margin:0 auto}
.answer input{flex:1 1 auto;min-width:0;height:58px;padding:0 16px;font:500 19px var(--body);color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:12px}
.answer input::placeholder{color:var(--dim)}
.answer input:disabled{opacity:.45}
.answer button{flex:0 0 64px;width:64px;height:58px;border-radius:12px;border:1px solid var(--line2);background:var(--fg);color:var(--bg);display:grid;place-items:center}
.answer .idk{background:var(--panel2);color:var(--fg);font:600 12px/1.15 var(--body);padding:0 4px;text-align:center}
.answer button:disabled{background:var(--panel2);color:var(--dim)}
.barfb{max-width:900px;margin:0 auto 6px;padding:10px 14px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px}
.barrow{display:flex;gap:4px;max-width:900px;margin:0 auto}
.answer .bbtn{flex:1 1 0;width:auto;display:flex;align-items:center;justify-content:center;gap:10px;font:600 19px var(--body);background:var(--fg);color:var(--bg)}
.answer .bbtn.sec{background:var(--panel2);color:var(--fg)}

/* results */
.res{text-align:center;display:grid;justify-items:center;gap:6px}
.res h2{font-family:var(--display);font-size:34px;margin:4px 0 0;text-transform:uppercase;letter-spacing:.04em}
.gauge{width:min(300px,80vw)}
.gauge .num{font-family:var(--mono);font-weight:600;font-size:44px}
.newhs{color:var(--yellow);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.breakdown{font-size:14px;color:var(--muted);margin:2px 0 6px}
.res .stats{width:100%}
.res .btnrow{justify-content:center;width:100%}
.res .btnrow .btn{flex:1 1 140px;padding:16px}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:20px}
.modal{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:22px;max-width:360px;width:100%;display:grid;gap:12px;
  /* v2.6: a tall sheet scrolls inside the screen instead of pushing buttons out of reach */
  max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;overscroll-behavior:contain}
.modal h3{margin:0;font-family:var(--display);font-size:26px}
.modal p{margin:0;color:var(--muted)}
.modal .btnrow .btn{flex:1}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.7}}
.glow{animation:glow 1.8s ease-in-out infinite;opacity:.5}
.desc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:18px;line-height:1.45;margin:0 0 12px}
.modes{display:grid;gap:10px}.modes .btn{padding:16px;text-align:left}.modes .btn small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
/* v2.0: coming-soon tiles and image placeholders */
.tile.soon{opacity:.55;border-style:dashed;cursor:default}
.tile.soon:hover{transform:none;border-color:var(--line)}
.badge{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;color:var(--muted)}
.figure.ph{display:grid;place-items:center;min-height:130px;border:1px dashed var(--line2);background:transparent}
.phin{display:grid;justify-items:center;gap:4px;color:var(--muted);font-size:14px;text-align:center;padding:10px}
.phin b{color:var(--fg);font-weight:600;font-size:15px}
.phin span{font-family:var(--mono);font-size:13px}
/* v2.6: save warning banner and backup sheet */
#savebar{position:sticky;top:0;z-index:25;margin:0 -4px 12px;background:#3a1416;border:1px solid var(--red);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;
  padding-right:62px}  /* clear of the fixed menu button */
#savebar b{display:block;color:var(--red);font-weight:600;font-size:15px}
#savebar p{margin:2px 0 0;color:var(--fg)}
#savebar button{flex:0 0 auto;background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 12px;font-weight:600;align-self:center}
.modal.wide{max-width:430px}
.modal .note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--muted);margin:0}
.modal .note b{color:var(--fg)}
.modal .ok{color:var(--green);font-weight:600}
.modal .bad{color:var(--red);font-weight:600}
.modal textarea{width:100%;box-sizing:border-box;min-height:86px;background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;resize:vertical}
.modal ol{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}
.modal ol b{color:var(--fg)}
.modal .msg{margin:0;font-size:14px}
.modal .sub{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted);margin:4px 0 -4px}
/* v2.7: identification cards — the marked picture before answering, the tip after a miss */
.qimg{position:relative;padding:0;overflow:hidden}
.qimg img{display:block;width:100%;height:auto}
.qimg .hl{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.20;pointer-events:none}
/* v2.8: deck-tile dots — kind of deck, and what pictures it has */
.tile{position:relative}
.dots{position:absolute;top:10px;right:10px;display:flex;gap:5px}
.dots i,.legend i{width:9px;height:9px;border-radius:50%;display:block;flex:0 0 auto}
.k-id{background:#4fd4ff}
.k-fn{background:var(--yellow)}
.k-term{background:var(--line2)}
.p-yes{background:var(--green)}
.p-after{box-shadow:inset 0 0 0 2px var(--green)}
.p-no{box-shadow:inset 0 0 0 2px var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:-2px 0 12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;gap:5px;align-items:center}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tip{margin:10px 0 0;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--yellow);border-radius:10px;color:var(--fg);font-size:15px;line-height:1.45}
.figure .phin svg{width:30px;height:24px;max-height:none}
.figbtn{display:block;width:100%;padding:6px;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:zoom-in}
.figbtn img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;border-radius:8px}
.figcap{font-size:13px;color:var(--muted);margin:6px 2px 0}
.zoom{position:fixed;inset:0;z-index:60;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom img{display:block;width:max(100%,1000px);height:auto}
.zoomx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:61;width:44px;height:44px;border-radius:10px;border:0;background:var(--bg);color:var(--fg);font-size:22px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){.prompt{font-size:24px}.stat .v{font-size:26px}.brand{font-size:22px}}
</style>

<script>
/* ===================== CONTENT ===================== */
/* Term decks (v2.0). Each card: answer, other accepted answers, clue, OpenStax figure for the image slot. */
const NEWDECKS=[];
function D(id,unit,name,q,fig,text){
  const items=text.trim().split("\n").map((ln,i)=>{const p=ln.split("|").map(s=>s.trim());
    const alts=p[1]?p[1].split(";").map(s=>s.trim()).filter(Boolean):[];
    return {id:id+"-"+i,name:p[0],accept:[p[0].toLowerCase()].concat(alts),clue:p[2],fig:p[3]||fig,tip:(p[4]||"").trim()||undefined};});
  return {id,unit,name,q,fig,items};
}
/* ===== v2.0 deck content, part 1: Units 1, 3, 4 =====
   Line format:  Answer | other accepted answers (;) | clue shown on the card | OpenStax figure (optional) */
NEWDECKS.push(
D("ch1-reg","ch1","Anatomical Position & Body Regions","Which term or body region is this?","1.12",`
Anatomical position | | The standard reference posture: standing upright, feet parallel, arms at the sides, palms facing forward.
Prone | | Lying face down.
Supine | | Lying face up.
Cephalic | | Region: the head.
Cranial | | Region: the part of the head that encloses the brain (the skull).
Facial | | Region: the face.
Frontal | | Region: the forehead.
Orbital | ocular | Region: the eye.
Otic | | Region: the ear.
Nasal | | Region: the nose.
Buccal | | Region: the cheek.
Oral | | Region: the mouth.
Mental | | Region: the chin.
Occipital | | Region: the back of the head, at the base of the skull.
Cervical | | Region: the neck.
Thoracic | | Region: the chest.
Sternal | | Region: the breastbone.
Mammary | | Region: the breast.
Axillary | | Region: the armpit.
Acromial | | Region: the point of the shoulder.
Scapular | | Region: the shoulder blade.
Brachial | | Region: the arm, between the shoulder and the elbow.
Antecubital | | Region: the front of the elbow.
Olecranal | | Region: the back of the elbow.
Antebrachial | | Region: the forearm.
Carpal | | Region: the wrist.
Palmar | | Region: the palm of the hand.
Digital | phalangeal | Region: the fingers or toes.
Pollex | | Region: the thumb.
Abdominal | | Region: the abdomen.
Umbilical | | Region: the navel.
Lumbar | | Region: the lower back.
Sacral | | Region: between the hips, over the sacrum.
Gluteal | | Region: the buttock.
Coxal | | Region: the hip.
Inguinal | | Region: the groin, where the thigh meets the trunk.
Pubic | | Region: the genital area, over the pubic bone.
Femoral | | Region: the thigh.
Patellar | | Region: the kneecap (front of the knee).
Popliteal | | Region: the back of the knee.
Crural | | Region: the front of the leg (the shin), between the knee and the ankle.
Sural | | Region: the calf.
Tarsal | | Region: the ankle.
Pedal | | Region: the foot.
Calcaneal | | Region: the heel.
Plantar | | Region: the sole of the foot.
Hallux | | Region: the great (big) toe.
`),
D("ch1-dir","ch1","Directional Terms","Which directional term fits?","1.13",`
Anterior | ventral | Toward the front of the body.
Posterior | dorsal | Toward the back of the body.
Superior | cranial | Above; toward the head.
Inferior | caudal | Below; toward the feet.
Medial | | Toward the midline of the body.
Lateral | | Away from the midline; toward the side.
Proximal | | Closer to the trunk or to a limb's point of attachment.
Distal | | Farther from the trunk or from a limb's point of attachment.
Superficial | | Closer to the surface of the body.
Deep | | Farther from the surface of the body.
Inferior | caudal | The coccyx is ___ to the sacrum.
Medial | | The pubic symphysis is ___ to the inguinal ligament.
Superior | cranial | The psoas major is ___ to the rectus femoris.
Posterior | dorsal | The gluteus medius is ___ to the rectus femoris.
Distal | | The wrist is ___ to the elbow.
Proximal | | The knee is ___ to the ankle.
Superficial | | The skin is ___ to the skeletal muscles.
Deep | | The lungs are ___ to the ribs.
Anterior | ventral | The sternum is ___ to the heart.
Lateral | | The ears are ___ to the nose.
Superior | cranial | The nose is ___ to the mouth.
`),
D("ch1-pl","ch1","Body Planes","Which plane is this?","1.14",`
Sagittal plane | sagittal | Vertical plane that divides the body into right and left sides.
Midsagittal plane | midsagittal; median plane; median | Sagittal plane exactly down the midline, making equal right and left halves.
Parasagittal plane | parasagittal | Sagittal plane off the midline, making unequal right and left parts.
Frontal plane | frontal; coronal plane; coronal | Vertical plane that divides the body into front (anterior) and back (posterior) portions.
Transverse plane | transverse; horizontal plane; horizontal | Horizontal plane that divides the body into upper (superior) and lower (inferior) portions.
Transverse plane | transverse; horizontal plane; horizontal; cross section | A cut that gives a cross section, like the "slices" in a CT scan.
`),
D("ch1-cav","ch1","Body Cavities","Which body cavity or structure is this?","1.15",`
Dorsal cavity | posterior cavity; dorsal body cavity; posterior body cavity | Body cavity on the back side that holds the cranial cavity and the vertebral canal.
Cranial cavity | | Subdivision of the dorsal cavity that houses the brain.
Vertebral canal | spinal canal; spinal cavity; vertebral cavity | Subdivision of the dorsal cavity that encloses the spinal cord.
Ventral cavity | anterior cavity; ventral body cavity; anterior body cavity | Large body cavity on the front side that holds the thoracic and abdominopelvic cavities.
Thoracic cavity | | Upper subdivision of the ventral cavity, enclosed by the rib cage.
Abdominopelvic cavity | | Lower subdivision of the ventral cavity; holds the digestive, urinary and reproductive organs.
Diaphragm | | Dome-shaped muscle that separates the thoracic cavity from the abdominopelvic cavity.
Pleural cavity | pleural cavities | Subdivision of the thoracic cavity that surrounds each lung.
Pericardial cavity | | Subdivision of the thoracic cavity that surrounds the heart.
Mediastinum | | Central region of the thoracic cavity between the lungs; holds the heart, trachea and esophagus.
Abdominal cavity | | Upper part of the abdominopelvic cavity; holds most of the digestive organs.
Pelvic cavity | | Lower part of the abdominopelvic cavity; holds the urinary bladder and reproductive organs.
`),
D("ch1-abd","ch1","Abdominal Regions & Quadrants","Which region or quadrant is this?","1.16",`
Right upper quadrant | ruq | Quadrant on the patient's right, above the navel; holds most of the liver and the gallbladder.
Left upper quadrant | luq | Quadrant on the patient's left, above the navel; holds the stomach and spleen.
Right lower quadrant | rlq | Quadrant on the patient's right, below the navel; holds the appendix.
Left lower quadrant | llq | Quadrant on the patient's left, below the navel; holds the sigmoid colon.

/* ===================== ANSWER CHECKING ===================== */
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const legacyLabel=a=>a.replace(/\b(er|rer|ser|mtoc)\b/g,m=>m.toUpperCase()).replace(/^./,c=>c.toUpperCase()).replace(/\bgolgi\b/i,"Golgi");
function mkVocab(list,legacy){const seen=new Set(),out=[];list.forEach(st=>st.accept.forEach((a,k)=>{const n=norm(a);if(!n||seen.has(n))return;seen.add(n);
  out.push({id:st.id,n,label:legacy?legacyLabel(a):k===0?st.name:a.replace(/^./,c=>c.toUpperCase())});}));return out;}
const LEGACY_VOCAB=mkVocab(STRUCT.concat(MITO),true);
const vocabFor=id=>DECKS[id].items?(DECKS[id]._v||(DECKS[id]._v=mkVocab(DECKS[id].items,false))):LEGACY_VOCAB;
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function classify(raw,deckId){
  const n=norm(raw); if(!n) return {kind:"empty"};
  const VOCAB=vocabFor(deckId),legacy=!DECKS[deckId].items;
  const hit=VOCAB.find(v=>v.n===n); if(hit) return {kind:"answer",id:hit.id,n:hit.n};
  if(legacy&&["er","endoplasmicreticulum","reticulum","endoplasmic"].includes(n)) return {kind:"nudge",msg:"Be specific: rough ER or smooth ER?"};
  if(legacy&&["golgi","golgis","golgiapparatis"].includes(n)) return {kind:"nudge",msg:"Use the full name for this one."};
  let best=null,bd=99,tie=false;
  VOCAB.forEach(v=>{const d=lev(n,v.n);if(d<bd){bd=d;best=v;tie=false}else if(d===bd&&best&&v.id!==best.id)tie=true;});
  const lim=n.length<=5?1:n.length<=10?2:3;
  if(best&&bd<=lim&&!tie) return {kind:"suggest",v:best};
  if(best&&bd<=lim&&tie) return {kind:"nudge",msg:"Check your spelling. That's close to more than one answer."};
  return {kind:"unknown"};
}

/* ===================== STORAGE ===================== */
/* Saved shape on disk: {v, rounds, best, savedAt}. DATA in memory stays {rounds, best}.
   When the shape changes: bump SCHEMA and add a step to MIGRATE. Never drop an old save.
   Every read and write goes through STORE, so a cloud account can replace it later. */
const LS="anat101.v1", LS_BAK="anat101.v1.backup", SCHEMA=2;
let DATA={rounds:[],best:{}};
let saveState={ok:true,err:"",recovered:false,savedAt:null};

const STORE={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){localStorage.setItem(k,v);},            // throws on failure, on purpose
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};

/* v1 -> v2: Cells moved from Unit 1 to Unit 3, so old rounds are re-filed (never mutates frozen db objects) */
const refileU1=d=>({rounds:(d.rounds||[]).map(r=>r&&r.unit==="u1"?Object.assign({},r,{unit:"ch3"}):r),best:Object.assign({},d.best||{})});
const MIGRATE={1:refileU1};
const migrate=d=>refileU1(d);                      // the db path still re-files old rounds
function upgrade(raw){
  let v=Number(raw&&raw.v)||1, d={rounds:raw.rounds||[],best:raw.best||{}};
  while(v<SCHEMA){ if(MIGRATE[v]) d=MIGRATE[v](d); v++; }
  return d;
}
const isSave=o=>!!o&&typeof o==="object"&&Array.isArray(o.rounds);
const parseSave=s=>{try{const o=JSON.parse(s);return isSave(o)?o:null;}catch(e){return null;}};

/* Load the save; fall back to the rolling backup if the main one is gone or unreadable. */
function loadLocal(){
  let raw=parseSave(STORE.get(LS)), from="save";
  if(!raw){raw=parseSave(STORE.get(LS_BAK));from="backup";}
  if(!raw) return;
  DATA=upgrade(raw);
  saveState.savedAt=raw.savedAt||null;
  if(from==="backup"){saveState.recovered=true;saveLocal();}
  else if((Number(raw.v)||1)<SCHEMA) saveLocal();  // write the upgraded save back once
}
function saveLocal(){
  const body=JSON.stringify({v:SCHEMA,rounds:DATA.rounds,best:DATA.best,savedAt:Date.now()});
  try{
    const prev=STORE.get(LS);
    STORE.set(LS,body);
    if(prev&&prev!==body){try{STORE.set(LS_BAK,prev);}catch(e){}}  // keep the last good save
    saveState.ok=true;saveState.err="";saveState.savedAt=Date.now();
    saveBanner();
    return true;
  }catch(e){
    saveState.ok=false;saveState.err=(e&&e.name)||"error";
    saveBanner();
    return false;
  }
}
/* Safari can clear a site's data after about 7 days unused. A home-screen install plus
   this request is what keeps progress; the request is silent and may be refused. */
async function keepStorage(){
  try{
    if(!navigator.storage||!navigator.storage.persist) return;
    if(await navigator.storage.persisted()) return;
    await navigator.storage.persist();
  }catch(e){}
}
loadLocal();
let remote=null; // {ref}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const user=await window.claude.use("user"); const db=await window.claude.use("db");
    if(!user||!db) return; const id=await user.id(); if(!id) return;
    const ref=db.collection("data/users/"+id).doc("stats");
    const snap=await ref.get(); remote={ref};
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.rounds)&&d.rounds.length>=DATA.rounds.length){DATA=migrate(JSON.parse(JSON.stringify({rounds:d.rounds,best:d.best||{}})));saveLocal();if(view.page!=="play")render();}}
    else if(DATA.rounds.length){await ref.set(DATA);}
  }catch(e){}
}
async function save(){saveLocal();keepStorage();if(remote){try{await remote.ref.set(DATA);}catch(e){}}}

/* Two dots in a deck tile's corner: what kind of deck it is, and whether it has
   pictures to answer from. Which decks actually have pictures varies a lot, so being
   able to see it from the unit screen saves opening a deck to find out. */
function deckKind(d){
  if(d.ident) return {cls:"k-id",label:"Identification deck"};
  if(d.fn) return {cls:"k-fn",label:"Name it from what it does"};
  return {cls:"k-term",label:"Term and definition deck"};
}
function deckPics(d){
  const its=itemsFor(d.id)||[];        /* not every deck carries .items directly */
  const n=its.filter(i=>IDIMG.has(i.id)).length;

  const figs=its.filter(i=>i.fig&&i.fig!=="-"&&FIGS.has(i.fig)).length;

function playPage(){
  const q=round.qs[round.i],n=round.qs.length;
  const v=q.view,dk=DECKS[round.deck];
  const fnDeck=!!dk.fn, showImg=!fnDeck||round.images;
  let prompt,art,hint,tag,desc;
  if(dk.items){
    const f=q.st.fig&&q.st.fig!=="-"?q.st.fig:null;
    prompt=esc(q.st.q||dk.q); desc=`<p class="desc">${esc(q.st.clue)}</p>`; hint="";
    const ph=`<div class="figure ph" role="img" aria-label="Image coming soon"><div class="phin"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><path d="M3 6h5l2-3h10l2 3h5v15H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="15" cy="13" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><b>Image coming soon</b>${f?`<span>OpenStax Figure ${esc(f)}</span>`:""}</div></div>`;
    /* An identification card shows the structure marked but unnamed before you answer,
       then the same picture with its name on it. Labeled textbook figures would give the
       answer away, so they only ever appear once the card is answered. */
    const ident=!!dk.ident, idf=ident?idFiles(q.st):null;
    const after=f&&FIGS.has(f)?`<button type="button" class="figbtn" id="figzoom" data-zoom="figs/${esc(f)}.jpg" aria-label="Enlarge OpenStax Figure ${esc(f)}"><img src="figs/${esc(f)}.jpg" alt="OpenStax Figure ${esc(f)}"></button><p class="figcap">OpenStax Figure ${esc(f)} · tap to enlarge</p>`:ph;
    if(round.state!=="done"){
      art=(ident&&round.images&&idf)?`<div class="figure qimg" id="qimg"><img src="${esc(idf.q)}" alt="Unlabeled figure with one structure marked"><img class="hl" src="${esc(idf.m)}" alt=""></div>`:"";
    }else if(ident&&idf){
      art=`<button type="button" class="figbtn" id="aimg" data-zoom="${f&&FIGS.has(f)?`figs/${esc(f)}.jpg`:esc(idf.a)}" aria-label="Enlarge the textbook figure"><img src="${esc(idf.a)}" alt="The structure named"></button><p class="figcap">Tap for the full textbook figure</p>`;
    }else{
      art=after;   /* the figure follows the answer in both modes now */
    }
    if(round.state==="done"&&ident&&round.lastMissed&&q.st.tip) art+=`<p class="tip" id="tip">${esc(q.st.tip)}</p>`;
    tag=ident&&!round.images?"Clue only":!round.images&&!ident?"Images off":f?"Fig. "+esc(f):"No figure";
  }else{
  prompt=fnDeck?"Which structure does this?":v.prompt?v.prompt:q.st.prompt&&!v.close?q.st.prompt:v.ring?(v.close?"Name the circled structure.":"What is the circled structure?"):"Name this structure.";
  art=showImg?`<div class="figure">${figureSVG(v)}</div>`:"";
  hint=!fnDeck&&q.st.hint?`<p class="hint">${esc(q.st.hint)}</p>`:"";
  tag=!showImg?"Images off":v.tag?v.tag:v.close?"Close-up":"Whole cell";
  desc=fnDeck?`<p class="desc">${esc(q.st.fn)}</p>`:"";
  }
  app.innerHTML=`<div class="top"><div><div class="crumb">${esc(DECKS[round.deck].name)}</div><div class="brand">Round in play</div></div></div>
  <div class="qhead"><span class="qnum">Question ${round.i+1} / ${n}</span><span class="qnum">${tag}</span></div>
  <div class="bar"><i style="width:${(round.i+(round.state==="done"?1:0))/n*100}%"></i></div>
  <h1 class="prompt">${prompt}</h1>
  ${desc}${art}${hint}
  <div class="feedback" id="fb"></div><div class="spacer"></div>`;
  const locked=round.state!=="ask";
  const last=round.i===round.qs.length-1;
  let bar;
  if(round.state==="done") bar=`<div class="answer"><div class="barrow"><button type="button" class="bbtn" id="next">${last?"See results":"Next"}<svg width="20" height="16" viewBox="0 0 20 16"><path d="M2 8h15m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>`;
  else if(round.state==="suggest") bar=`<div class="answer"><div class="barrow"><button type="button" class="bbtn sec" id="sug-no">No, retype</button><button type="button" class="bbtn" id="sug-yes">Yes, submit</button></div></div>`;
  else bar=`<div class="answer"><form id="af" autocomplete="off"><button type="button" id="idk" class="idk" aria-label="I don't know" ${locked?"disabled":""}>I don't<br>know</button><input id="ans" type="text" placeholder="${locked?"":"Type your answer"}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" ${locked?"disabled":""} aria-label="Your answer"><button type="submit" id="go" aria-label="Submit answer" ${locked?"disabled":""}><svg width="26" height="22" viewBox="0 0 26 22"><path d="M22 2v9a3 3 0 0 1-3 3H5m0 0 5-5m-5 5 5 5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form></div>`;
  if(round.fb) bar=bar.replace('<div class="answer">','<div class="answer"><div class="barfb" role="status">'+round.fb+'</div>');
  $("#answerSlot").innerHTML=bar;
  const fz=$("#figzoom")||$("#aimg"); if(fz){fz.onclick=()=>{const s=fz.getAttribute("data-zoom")||fz.querySelector("img").getAttribute("src");$("#modalSlot").innerHTML=`<div class="zoom" role="dialog" aria-modal="true" aria-label="Figure"><img src="${s}" alt=""></div><button class="zoomx" id="zoomx" aria-label="Close">✕</button>`;$("#zoomx").onclick=()=>{$("#modalSlot").innerHTML="";};$("#zoomx").focus();};}
  const af=$("#af"); if(af){af.onsubmit=e=>{e.preventDefault();submit($("#ans").value);};$("#idk").onclick=giveUp;}

  const nx=$("#next"); if(nx){nx.onclick=()=>{try{next();}catch(e){console.error(e);if(round.i>=round.qs.length-1)finish();}};nx.focus();}
  const yes=$("#sug-yes"); if(yes){yes.onclick=()=>{const v=round.pending;round.pending=null;round.fb="";grade(v);};$("#sug-no").onclick=()=>{round.pending=null;round.fb="";round.state="ask";playPage();$("#ans").focus();};yes.focus();}
  if(!locked){const inp=$("#ans");if(round.keep)inp.value=round.keep;round.keep="";if(matchMedia("(pointer:fine)").matches)inp.focus();}
}
function setFb(html,state){round.fb=html;round.state=state;playPage();}
function submit(raw){
  const c=classify(raw,round.deck);
  if(c.kind==="empty") return;
  if(c.kind==="nudge"){round.keep=raw;return setFb(`<div class="fb warn">${esc(c.msg)}<small>Free retry. This doesn't count as a try.</small></div>`,"ask");}
  if(c.kind==="suggest"){round.pending=c.v;return setFb(`<div class="fb warn">Did you mean “${esc(c.v.label)}”?</div>`,"suggest");}
  const q0=round.qs[round.i];
  if(c.kind==="answer"&&q0.st.near&&q0.st.near[c.id]){round.keep=raw;return setFb(`<div class="fb warn">${esc(q0.st.near[c.id])}<small>Free retry. This doesn't count as a try.</small></div>`,"ask");}
  grade(c.kind==="answer"?c:null);
}
function grade(v){
  const q=round.qs[round.i];
  if(v&&(v.id===q.st.id||(q.st.also||[]).includes(v.id)||q.st.accept.some(a=>norm(a)===v.n))){
    if(round.tries===0){round.credit+=1;round.first++;}else{round.credit+=0.5;round.second++;}
    round.lastMissed=false;
    return setFb(`<div class="fb ok"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="var(--green)"/><path d="m7 13.5 4 4 8-9" stroke="#111" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div>Correct${round.tries?" <small>On the retry: half credit.</small>":""}</div></div>`,"done");
  }
  round.tries++;
  if(round.tries<2) return setFb(`<div class="fb bad">✕ Not quite<small>One more try.</small></div>`,"ask");
  round.missed++;round.lastMissed=true;
  setFb(`<div class="fb bad">✕ The answer is ${esc(q.st.name)}</div>`,"done");
}
function giveUp(){
  const q=round.qs[round.i];round.missed++;round.keep="";round.lastMissed=true;
  setFb(`<div class="fb bad">The answer is ${esc(q.st.name)}<small>Counted as missed.</small></div>`,"done");
}
function next(){
  round.i++;round.tries=0;round.fb="";round.state="ask";round.lastMissed=false;
  if(round.i>=round.qs.length) return finish();
  playPage();scrollTo(0,0);
}
function finish(){
  const total=round.qs.length,pct=Math.round(round.credit/total*100);
  let prev=null,isHigh=true;
  try{
    prev=DATA.best[round.deck]??null; isHigh=prev==null||pct>prev;
    const rounds=DATA.rounds.concat([{deck:round.deck,unit:DECKS[round.deck].unit,credit:round.credit,total,pct,ts:Date.now()}]);
    const best=Object.assign({},DATA.best); if(isHigh)best[round.deck]=pct;
    DATA={rounds,best};
  }catch(e){console.error("record failed",e);}
  round.result={pct,prev,isHigh,total,best:Math.max(pct,prev??0)};
  view={page:"results"};
  try{render();}catch(e){console.error(e);}
  scrollTo(0,0);
  setTimeout(()=>{try{save();}catch(e){}},0);
}
function gaugeSVG(p){
  const cx=120,cy=120,r=92,start=135,sweep=270;
  const pt=a=>{const t=a*Math.PI/180;return[cx+r*Math.cos(t),cy+r*Math.sin(t)];};
  const[sx,sy]=pt(start),[ex,ey]=pt(start+sweep);
  const arc=`M${sx} ${sy} A${r} ${r} 0 1 1 ${ex} ${ey}`;const len=2*Math.PI*r*sweep/360;
  const col=p<=33?"var(--red)":p<=66?"var(--yellow)":"var(--green)";
  let ticks="";for(let k=0;k<=10;k++){const a=(start+sweep*k/10)*Math.PI/180;ticks+=`<line x1="${cx+(r-22)*Math.cos(a)}" y1="${cy+(r-22)*Math.sin(a)}" x2="${cx+(r-(k%5?28:32))*Math.cos(a)}" y2="${cy+(r-(k%5?28:32))*Math.sin(a)}" stroke="#5d5d64" stroke-width="2"/>`;}
  return `<svg viewBox="0 0 240 216" class="gauge" role="img" aria-label="Score ${p} percent">
  <path d="${arc}" fill="none" stroke="#26262b" stroke-width="18" stroke-linecap="round"/>
  <path id="gfill" d="${arc}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/>
  ${ticks}
  <g id="needle" transform="rotate(-135 ${cx} ${cy})" style="transition:transform 1.2s cubic-bezier(.2,.8,.2,1)"><path d="M${cx-6} ${cy} L${cx} ${cy-62} L${cx+6} ${cy}Z" fill="#ececee"/></g>
  <circle cx="${cx}" cy="${cy}" r="9" fill="#ececee"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="#111"/>
  <text x="${sx+4}" y="${sy+24}" fill="#8e8e95" font-size="12" font-family="IBM Plex Mono,monospace" text-anchor="middle">0</text>
  <text x="${ex-4}" y="${ey+24}" fill="#8e8e95" font-size="12" font-family="IBM Plex Mono,monospace" text-anchor="middle">100</text>
  <text x="${cx}" y="${cy+80}" fill="${col}" font-size="40" font-weight="600" font-family="IBM Plex Mono,monospace" text-anchor="middle">${p}%</text></svg>`;
}
function resultsPage(){
  const R=round.result,p=R.pct;
  app.innerHTML=`<div class="top"><div><div class="crumb">${esc(DECKS[round.deck].name)}</div><div class="brand">Round complete</div></div></div>
  <div class="res">${gaugeSVG(p)}${R.isHigh&&R.prev!=null?`<div class="newhs">New high score</div>`:""}
  <div class="breakdown">${round.first} first try · ${round.second} on retry (half credit) · ${round.missed} missed</div>
  <div class="stats"><div class="stat"><div class="v c-green">${p}%</div><div class="k">Right</div></div><div class="stat"><div class="v c-red">${100-p}%</div><div class="k">Wrong</div></div>
  <div class="stat"><div class="v ${pctClass(p)}">${p}%</div><div class="k">Current score</div></div><div class="stat"><div class="v c-yellow">${R.best}%</div><div class="k">High score</div></div></div>
  <div class="btnrow"><button class="btn primary" id="again">Play again</button><button class="btn" id="tolobby">Lobby</button></div></div>`;
  $("#again").onclick=()=>startRound(round.deck,round.images);
  $("#tolobby").onclick=()=>{view={page:"lobby"};render();};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$("#gfill");if(f)f.style.strokeDashoffset=f.getAttribute("stroke-dasharray")*(1-p/100);const nd=$("#needle");if(nd)nd.setAttribute("transform",`rotate(${-135+270*p/100} 120 120)`);}));
}

/* ===================== SAVE HEALTH, BACKUP, INSTALL ===================== */
/* No esc() in here: this runs while the save loads, before the UI section's consts exist. */
function h(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function saveBanner(){
  const el=document.getElementById("savebar"); if(!el) return;
  if(saveState.ok&&!saveState.recovered){el.hidden=true;el.innerHTML="";return;}
  el.innerHTML=saveState.ok
    ? `<div><b>Restored from backup</b><p>The main save couldn't be read, so your last good save was put back. Check that your scores look right.</p></div><button id="savebar-x">OK</button>`
    : `<div><b>Progress isn't saving</b><p>This browser refused to store your save (${h(saveState.err)}). Private browsing and a full phone both do that. Back up your progress now so you don't lose it.</p></div><button id="savebar-x">Back up</button>`;
  el.hidden=false;
  const b=document.getElementById("savebar-x");
  if(b)b.onclick=()=>{ if(saveState.ok){saveState.recovered=false;saveBanner();} else backupSheet(); };
}

const standalone=()=>!!(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let installPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;});

const exportText=()=>JSON.stringify({app:"101% Anatomy",v:SCHEMA,exported:new Date().toISOString(),rounds:DATA.rounds,best:DATA.best});
/* Import adds rounds the current save doesn't have; it never deletes any. */
function mergeSave(raw){
  const inc=upgrade(raw), rounds=DATA.rounds.slice(), seen=new Set(rounds.map(r=>r&&r.deck+"|"+r.ts));
  let added=0;
  inc.rounds.forEach(r=>{if(!r)return;const k=r.deck+"|"+r.ts;if(seen.has(k))return;seen.add(k);rounds.push(r);added++;});
  rounds.sort((a,b)=>(a.ts||0)-(b.ts||0));
  const best=Object.assign({},DATA.best);
  Object.keys(inc.best||{}).forEach(k=>{if(best[k]==null||inc.best[k]>best[k])best[k]=inc.best[k];});
  DATA={rounds,best};
  return added;
}
const ago=t=>{if(!t)return "never";const m=Math.round((Date.now()-t)/60000);
  return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago";};

function backupSheet(msg){
  const rounds=DATA.rounds.length, decks=Object.keys(DATA.best).length;
  const where=standalone()?"the home-screen app":"a browser tab";
  const install=standalone()
    ? `<p class="note">You're in the home-screen app, which is where progress is safest.</p>`
    : `<p class="sub">Open it like an app</p>${isIOS()
        ? `<ol><li>Tap the <b>Share</b> button in Safari's bottom bar.</li><li>Choose <b>Add to Home Screen</b>.</li><li>Open 101% Anatomy from the new icon from now on.</li></ol><p class="note">The home-screen app keeps its <b>own</b> save, so export here first and import it there once.</p>`
        : `<p class="note">Install it for a desktop or home-screen icon that keeps your progress.</p><div class="btnrow"><button class="btn" id="bk-install"${installPrompt?"":" disabled"}>${installPrompt?"Install app":"Use your browser's install button"}</button></div>`}`;
  $("#modalSlot").innerHTML=`<div class="scrim"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="bkh">
    <h3 id="bkh">Save &amp; backup</h3>
    ${msg?`<p class="msg ${msg.bad?"bad":"ok"}">${h(msg.text)}</p>`:""}
    <p class="note">Saving: <span class="${saveState.ok?"ok":"bad"}">${saveState.ok?"working":"blocked ("+h(saveState.err)+")"}</span><br>
      Last saved: <b>${h(ago(saveState.savedAt))}</b><br>
      Stored: <b>${rounds}</b> round${rounds===1?"":"s"} · high scores on <b>${decks}</b> deck${decks===1?"":"s"}<br>
      Kept permanently: <b id="bk-persist">checking…</b><br>
      Running in: <b>${h(where)}</b></p>
    <p class="sub">Back up</p>
    <div class="btnrow"><button class="btn primary" id="bk-dl">Download backup</button><button class="btn" id="bk-copy">Copy code</button></div>
    <textarea id="bk-out" readonly aria-label="Your backup code">${h(exportText())}</textarea>
    <p class="sub">Restore</p>
    <p class="note">Adds anything missing to this save. Nothing is deleted.</p>
    <div class="btnrow"><button class="btn" id="bk-pick">Choose a backup file</button></div>
    <input type="file" id="bk-file" accept="application/json,.json,text/plain" hidden>
    <textarea id="bk-in" placeholder="…or paste a backup code here" aria-label="Paste a backup code"></textarea>
    <div class="btnrow"><button class="btn" id="bk-import">Restore from code</button></div>
    ${install}
    <div class="btnrow"><button class="btn" id="bk-x">Close</button></div>
  </div></div>`;
  const close=()=>{$("#modalSlot").innerHTML="";};
  const done=(text,bad)=>{close();backupSheet({text,bad});};
  try{if(navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{const el=$("#bk-persist");if(el)el.textContent=p?"yes":"not granted";});
      else{const el=$("#bk-persist");if(el)el.textContent="not supported";}}catch(e){}
  $("#bk-dl").onclick=()=>{
    try{
      const b=new Blob([exportText()],{type:"application/json"}), u=URL.createObjectURL(b), a=document.createElement("a");
      a.href=u;a.download="101-anatomy-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
    }catch(e){done("Download failed. Copy the code instead.",true);}
  };
  $("#bk-copy").onclick=async()=>{
    const t=$("#bk-out");t.select();
    try{await navigator.clipboard.writeText(exportText());done("Backup code copied.");}
    catch(e){try{document.execCommand("copy");done("Backup code copied.");}catch(e2){done("Couldn't copy. Select the code and copy it by hand.",true);}}
  };
  $("#bk-pick").onclick=()=>$("#bk-file").click();
  $("#bk-file").onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{const raw=parseSave(String(fr.result));
      if(!raw) return done("That file isn't a 101% Anatomy backup.",true);
      const n=mergeSave(raw); const ok=saveLocal(); if(remote)save();
      render(); done(n?`Restored ${n} round${n===1?"":"s"}.`+(ok?"":" Saving is still blocked, so keep the file."):"Nothing new in that backup — you already have it all.");};
    fr.onerror=()=>done("Couldn't read that file.",true);
    fr.readAsText(f);
  };
  $("#bk-import").onclick=()=>{
    const raw=parseSave($("#bk-in").value.trim());
    if(!raw) return done("That code isn't a 101% Anatomy backup.",true);
    const n=mergeSave(raw); const ok=saveLocal(); if(remote)save();
    render(); done(n?`Restored ${n} round${n===1?"":"s"}.`+(ok?"":" Saving is still blocked, so keep the code."):"Nothing new in that backup — you already have it all.");
  };
  const ib=$("#bk-install");
  if(ib&&installPrompt)ib.onclick=async()=>{try{await installPrompt.prompt();installPrompt=null;close();}catch(e){}};
  $("#bk-x").onclick=close;
  $("#bk-x").focus({preventScroll:true});   // keep the sheet opened at the top
  $(".modal").scrollTop=0;
}

/* A left swipe on an answered card is the same as tapping Next — quicker on a phone
   when you are flicking through cards you already know. */
function bindSwipe(){
  const el=$("#app");
  if(!el||el.dataset.swipe) return;
  el.dataset.swipe="1";
  let sx=0,sy=0;
  el.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  el.addEventListener("touchend",e=>{
    if(!round||round.state!=="done") return;                 // nothing to skip past yet
    if($("#modalSlot").innerHTML.trim()) return;             // a zoom or dialog is open
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(dx<=-60&&Math.abs(dx)>1.5*Math.abs(dy)){              // sideways, not a scroll
      try{next();}catch(err){console.error(err);}
    }
  },{passive:true});
}

/* menu + leave guard */
const mb=$("#menubtn"),menu=$("#menu");
function closeMenu(){menu.hidden=true;mb.setAttribute("aria-expanded","false");}
mb.onclick=e=>{e.stopPropagation();const open=menu.hidden;menu.hidden=!open;mb.setAttribute("aria-expanded",String(open));};
document.addEventListener("click",e=>{if(!menu.hidden&&!menu.contains(e.target))closeMenu();});
function go(dest){
  closeMenu();
  const doIt=()=>{if(dest==="home")view={page:"lobby"};else{
      if(view.page==="unit")view={page:"lobby"};
      else if(view.page==="play"||view.page==="results")view={page:"unit",unit:DECKS[round.deck].unit};}
    render();scrollTo(0,0);};
  if(view.page==="play") return confirmLeave(doIt);
  doIt();
}
$("#m-back").onclick=()=>go("back"); $("#m-home").onclick=()=>go("home");
$("#m-save").onclick=()=>{closeMenu();backupSheet();};
function confirmLeave(yes){
  $("#modalSlot").innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Are you sure?</h3><p>You're in the middle of a round. Your progress won't save unless the round is over.</p><div class="btnrow"><button class="btn" id="no">No, keep playing</button><button class="btn primary" id="yes">Yes, leave</button></div></div></div>`;
  $("#no").onclick=()=>{$("#modalSlot").innerHTML="";};
  $("#yes").onclick=()=>{$("#modalSlot").innerHTML="";yes();};
  $("#no").focus();
}
window.addEventListener("beforeunload",e=>{if(view.page==="play"){e.preventDefault();e.returnValue="";}});

render(); saveBanner(); bindSwipe(); setTimeout(initRemote,0);
keepStorage();
/* Ask again after a real tap: some browsers only grant persistence on a user gesture. */
window.addEventListener("pointerdown",function once(){window.removeEventListener("pointerdown",once);keepStorage();},{once:true});
/* Offline shell, so the home-screen app opens without a connection. Skipped locally
   (the regression test serves over 127.0.0.1) so a stale worker can't shadow a new build. */
if("serviceWorker"in navigator&&location.protocol==="https:"&&!/^(localhost|127\.|\[::1\])/.test(location.hostname)){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
</script>

</body></html>
