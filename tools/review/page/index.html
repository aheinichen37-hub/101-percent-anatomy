<title>Spot Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one card at a time, picture first, three big answer buttons pinned under it. */
:root{
  --bg:#f4f5f3; --panel:#ffffff; --fg:#1b2420; --muted:#5d6b64; --line:#d6dcd8;
  --ok:#1f8a4c; --ok-bg:#dff3e7; --bad:#c2410c; --bad-bg:#fde6d8; --skip:#4a5a52;
  --pin:#e11d74; --accent:#0e6b5c; --accent-fg:#ffffff;
  --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1b2420; --fg:#e8eee9; --muted:#97a69d; --line:#2e3b35;
  --ok:#4cc582; --ok-bg:#163425; --bad:#ff9a62; --bad-bg:#3a2316; --skip:#a9b8af;
  --pin:#ff5aa5; --accent:#4cc5ae; --accent-fg:#06201b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1b2420; --fg:#e8eee9; --muted:#97a69d; --line:#2e3b35;
  --ok:#4cc582; --ok-bg:#163425; --bad:#ff9a62; --bad-bg:#3a2316; --skip:#a9b8af;
  --pin:#ff5aa5; --accent:#4cc5ae; --accent-fg:#06201b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;margin:0;
  padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}.bar .bad{background:var(--bad)}.bar .skip{background:var(--skip)}
.ask{margin:0;font-size:20px;line-height:1.25;text-wrap:balance}
.ask small{display:block;font-size:13px;color:var(--muted);font-family:var(--mono);margin-bottom:4px}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;line-height:0;touch-action:manipulation}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.stage.fixing{outline:3px solid var(--pin);cursor:crosshair}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:3px solid var(--pin);border-radius:50%;pointer-events:none;background:#ffffff33}
.pin::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:var(--pin);border-radius:50%}
.status{font-size:14px;min-height:20px;color:var(--muted)}
.status b{color:var(--fg)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;font-weight:600;padding:14px 8px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;min-height:52px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.ok{border-color:var(--ok);color:var(--ok)}
button.bad{border-color:var(--bad);color:var(--bad)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.on{background:var(--panel);box-shadow:inset 0 0 0 2px currentColor}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav button{padding:8px 12px;min-height:40px;font-weight:600;font-size:14px}
.nav .grow{flex:1}
.note{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.banner{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:14px}
.done{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:420px){.ask{font-size:18px}}
</style>
<div class="wrap" id="app"><p class="hint">Loading cards…</p></div>
<script>
/* Spot Check: reusable review page. Swap cards.json for a new batch (tools/review/export.py) and keep the page.
   Verdicts live in db collection "reviews", doc "<batch>__<card id>":
   {batch, card, verdict: "ok"|"fix"|"remove"|"skip", fx, fy (new spot as fractions of the picture), note, at} */
(async()=>{
const app=document.getElementById("app");
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cards=[],batch="batch",reviews={},db=null,col=null,saveErr="",idx=0,fixing=false,pend=null,filter="todo";
try{const r=await fetch("cards.json");const j=await r.json();cards=j.cards;batch=j.batch;}
catch(e){app.innerHTML='<p class="banner">Could not load cards.json.</p>';return;}
const key=c=>batch+"__"+c.id;
const verdictOf=c=>reviews[c.id]&&reviews[c.id].verdict;
function firstTodo(from){for(let k=0;k<cards.length;k++){const j=(from+k)%cards.length;if(!verdictOf(cards[j]))return j;}return -1;}
function list(){return filter==="todo"?cards.map((c,i)=>i).filter(i=>!verdictOf(cards[i])||i===idx):cards.map((c,i)=>i);}
async function save(c,v){
  const doc={batch,card:c.id,verdict:v.verdict,fx:v.fx??null,fy:v.fy??null,note:v.note||"",at:new Date().toISOString()};
  reviews[c.id]=doc;
  if(!col){saveErr="Not saving: sign in to the viewer to keep answers.";return;}
  try{await col.doc(key(c)).set(doc);saveErr="";}catch(e){saveErr="Could not save that answer ("+((e&&e.code)||"error")+"). It will not be kept.";}
}
function go(delta){const L=list();let p=L.indexOf(idx);if(p<0)p=0;p=Math.min(L.length-1,Math.max(0,p+delta));idx=L[p]??idx;fixing=false;pend=null;draw();}
function afterAnswer(){fixing=false;pend=null;const n=filter==="todo"?firstTodo(idx+1):Math.min(cards.length-1,idx+1);if(n>=0)idx=n;draw();}
function tally(){const t={ok:0,fix:0,remove:0,skip:0};cards.forEach(c=>{const v=verdictOf(c);if(v)t[v]++;});return t;}
function draw(){
  const t=tally(),done=t.ok+t.fix+t.remove+t.skip,left=cards.length-done;
  const pct=n=>(100*n/cards.length)+"%";
  const head=`<header><h1>Spot Check <span class="count">${E(batch)}</span></h1><span class="count">${done} of ${cards.length} done · ${t.ok} correct · ${t.fix} fixed · ${t.remove} removed</span></header>
  <div class="bar"><i class="ok" style="width:${pct(t.ok)}"></i><i class="bad" style="width:${pct(t.fix+t.remove)}"></i><i class="skip" style="width:${pct(t.skip)}"></i></div>
  ${saveErr?`<div class="banner">${E(saveErr)}</div>`:""}`;
  if(filter==="todo"&&left===0){
    app.innerHTML=head+`<div class="done"><b>All ${cards.length} cards have an answer.</b><p class="hint">Tell Claude the review is done and it will read your answers and apply the fixes.</p><div class="nav"><button id="all">Look back through them</button></div></div>`;
    document.getElementById("all").onclick=()=>{filter="all";idx=0;draw();};return;}
  const c=cards[idx],v=reviews[c.id],pos=(filter==="todo"?list():cards.map((x,i)=>i)).indexOf(idx)+1,total=(filter==="todo"?list():cards).length;
  let status="";
  if(v){status=({ok:"<b>Marked correct.</b>",fix:"<b>Marked for a new spot.</b> Your pin is shown.",remove:"<b>Marked to remove the picture.</b>",skip:"<b>Skipped.</b>"})[v.verdict];}
  else if(fixing){status="<b>Tap the picture where the structure really is.</b> Then press Save spot.";}
  else status="The ring or tinted area is where the game says it is.";
  const showPin=pend||(v&&v.verdict==="fix"&&v.fx!=null?{fx:v.fx,fy:v.fy}:null);
  app.innerHTML=head+`
  <p class="ask"><small>${E(c.deck)} · ${E(c.id)} · figure ${E(c.fig)} · ${pos} of ${total}</small>Is the highlight on the <b>${E(c.name)}</b>?</p>
  <div class="stage${fixing?" fixing":""}" id="stage"><img id="img" src="${c.img}" alt="Picture for ${E(c.name)} with the highlighted spot">${showPin?`<span class="pin" style="left:${showPin.fx*100}%;top:${showPin.fy*100}%"></span>`:""}</div>
  <div class="status" id="status">${status}</div>
  ${fixing?`<div class="row" style="grid-template-columns:1fr 1fr"><button id="save" class="primary"${pend?"":" disabled"}>Save spot</button><button id="cancel">Cancel</button></div>`:
  `<div class="row"><button id="ok" class="ok${v&&v.verdict==="ok"?" on":""}">✓ Correct</button><button id="fix" class="bad${v&&v.verdict==="fix"?" on":""}">Wrong spot</button><button id="remove" class="bad${v&&v.verdict==="remove"?" on":""}">Remove</button></div>`}
  <input class="note" id="note" placeholder="Optional note for Claude" value="${E((v&&v.note)||"")}" aria-label="Note">
  <div class="nav"><button id="prev">← Back</button><button id="skip">Skip</button><button id="next">Next →</button><span class="grow"></span>
  <button id="filter">${filter==="todo"?"Show all":"Only unanswered"}</button></div>
  <p class="hint">Correct = highlight is on the right structure. Wrong spot = tap where it should be. Remove = the picture is wrong or unusable, so the card goes back to clue only.</p>`;
  const $=id=>document.getElementById(id),note=()=>$("note").value.trim();
  if($("ok"))$("ok").onclick=async()=>{await save(c,{verdict:"ok",note:note()});afterAnswer();};
  if($("fix"))$("fix").onclick=()=>{fixing=true;pend=v&&v.fx!=null?{fx:v.fx,fy:v.fy}:null;draw();};
  if($("remove"))$("remove").onclick=async()=>{await save(c,{verdict:"remove",note:note()});afterAnswer();};
  if($("cancel"))$("cancel").onclick=()=>{fixing=false;pend=null;draw();};
  if($("save"))$("save").onclick=async()=>{if(!pend)return;await save(c,{verdict:"fix",fx:pend.fx,fy:pend.fy,note:note()});afterAnswer();};
  $("skip").onclick=async()=>{await save(c,{verdict:"skip",note:note()});afterAnswer();};
  $("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
  $("filter").onclick=()=>{filter=filter==="todo"?"all":"todo";if(filter==="todo"&&verdictOf(cards[idx])){const n=firstTodo(idx);if(n>=0)idx=n;}draw();};
  $("note").onchange=async()=>{if(v)await save(c,{...v,note:note()});};
  if(fixing)$("stage").onclick=ev=>{const r=$("img").getBoundingClientRect();
    pend={fx:Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),fy:Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))};
    draw();};
}
try{
  const claude=window.claude;const dbns=claude?await claude.use("db"):null;
  if(dbns){db=dbns;col=db.collection("reviews");
    await new Promise(res=>{let first=true;const t=setTimeout(res,10000);
      col.onSnapshot(s=>{s.docs.forEach(d=>{const x=d.data();if(x&&x.batch===batch)reviews[x.card]=x;});if(first){first=false;clearTimeout(t);res();}},()=>{clearTimeout(t);res();});});
  }else saveErr="Not saving: the database is not available in this view.";
}catch(e){saveErr="Could not reach the database. Answers will not be kept.";}
const n0=firstTodo(0);idx=n0>=0?n0:0;draw();
})();
</script>
